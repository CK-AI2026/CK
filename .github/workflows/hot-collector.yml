name: Collect hot topics

on:
  schedule:
    # GitHub Actions cron uses UTC: 07:00 and 22:00 Asia/Shanghai.
    - cron: "0 23,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hot-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$NOTION_TOKEN" || { echo "NOTION_TOKEN is not configured"; exit 1; }
          test -n "$DEEPSEEK_API_KEY" || { echo "DEEPSEEK_API_KEY is not configured"; exit 1; }

      - name: Collect and write topics
        run: python phase1-topic-hunter/transcript-tool/hot-collector.py
